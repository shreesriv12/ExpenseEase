m","space-md":"1rem","margin-md":"1.5rem","space-xl":"2rem","gutter-md":"1.5rem","margin-lg":"3rem",gutter:"1rem"},fontFamily:{"label-lg":["Inter"],"headline-lg-mobile":["Inter"],"label-sm":["Inter"],display:["Inter"],"headline-md":["Inter"],"title-md":["Inter"],"headline-sm":["Inter"],"currency-md":["Inter"],"body-lg":["Inter"],"headline-lg":["Inter"],"body-md":["Inter"],"body-sm":["Inter"],"currency-display":["Inter"]},fontSize:{"label-lg":["0.875rem",{lineHeight:"1.25rem",letterSpacing:"0.01em",fontWeight:"500"}],"headline-lg-mobile":["1.625rem",{lineHeight:"2.125rem",letterSpacing:"-0.02em",fontWeight:"600"}],"label-sm":["0.75rem",{lineHeight:"1rem",letterSpacing:"0.02em",fontWeight:"500"}],display:["3rem",{lineHeight:"3.5rem",letterSpacing:"-0.03em",fontWeight:"600"}],"headline-md":["1.5rem",{lineHeight:"2rem",letterSpacing:"-0.02em",fontWeight:"600"}],"title-md":["1.125rem",{lineHeight:"1.625rem",letterSpacing:"-0.01em",fontWeight:"500"}],"headline-sm":["1.25rem",{lineHeight:"1.75rem",letterSpacing:"-0.015em",fontWeight:"600"}],"currency-md":["1.125rem",{lineHeight:"1.5rem",letterSpacing:"-0.01em",fontWeight:"600"}],"body-lg":["1rem",{lineHeight:"1.5rem",fontWeight:"400"}],"headline-lg":["2rem",{lineHeight:"2.5rem",letterSpacing:"-0.025em",fontWeight:"600"}],"body-md":["0.875rem",{lineHeight:"1.375rem",fontWeight:"400"}],"body-sm":["0.75rem",{lineHeight:"1.125rem",fontWeight:"400"}],"currency-display":["2.25rem",{lineHeight:"2.75rem",letterSpacing:"-0.02em",fontWeight:"600"}]}}}};</script></head><body class="bg-surface font-body-md text-on-surface antialiased flex min-h-screen items-center justify-center p-margin"><main class="w-full max-w-md mx-auto"><div class="flex flex-col w-full">
<div class="w-full bg-surface-container-lowest rounded-xl shadow-sm p-6 sm:p-8 relative overflow-hidden transition-all duration-300">
<div class="flex flex-col items-center text-center mb-6">
<div class="flex items-center justify-center gap-2 mb-2">
<img alt="ExpenseEase Logo" class="h-10 w-auto object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDeWOAUfRgDfz8uAO-K42O7SO0YBLTSc9R18MVtWtTw2vZq4Xs0amVI2bhXdgeQwCdvKPbhX_2zi6Oh231fAu10bJ3virteB_xrw64BMv7uKHzO4F_a-RiAMS3BXpET7FBnfMkzlk2-z-GUoSeuVxk8AakhegoedNFtbbZ1-kwD8SpEd4lU3gaUsVcaU9P3OW795ullFywF1nPp1R4XMQJtrOjZFLXgcHeC42Y8_0JMItK0BA-iQjYE"/>
<span class="font-headline-sm text-headline-sm text-on-surface tracking-tight">ExpenseEase</span>
</div>
<p class="font-body-md text-body-md text-on-surface-variant max-w-xs">
        Split group expenses peacefully with friends &amp; roommates.
      </p>
</div>
<div class="flex p-1 bg-surface-container-low rounded-lg mb-6">
<button class="flex-1 py-2 text-center font-label-lg text-label-lg rounded transition-colors duration-150 bg-surface-container-lowest text-primary shadow-sm" id="tab-login" onclick="switchAuthMode('login')" type="button">
        Sign in
      </button>
<button class="flex-1 py-2 text-center font-label-lg text-label-lg rounded transition-colors duration-150 text-on-surface-variant hover:text-on-surface" id="tab-register" onclick="switchAuthMode('register')" type="button">
        Create account
      </button>
</div>
<div class="hidden mb-5 p-3.5 rounded-lg bg-error-container text-on-error-container flex items-start gap-2.5 animate-fadeIn" id="auth-error-box" role="alert">
<span class="material-symbols-outlined text-[20px] text-error flex-shrink-0 mt-0.5">error</span>
<div class="flex flex-col">
<span class="font-label-sm text-label-sm text-error uppercase tracking-wider font-semibold">Authentication Error</span>
<span class="font-body-sm text-body-sm">Invalid credentials. Please check your email and password.</span>
</div>
</div>
<form class="space-y-4" id="auth-form" novalidate="" onsubmit="handleAuthSubmit(event)">
<div class="hidden" id="field-name-container">
<label class="block font-label-lg text-label-lg text-on-surface mb-1.5" for="fullName">
          Full Name
        </label>
<div class="relative">
<input autocomplete="name" class="w-full h-11 px-3.5 rounded-lg bg-surface-container-lowest text-on-surface font-body-md text-body-md placeholder:text-outline shadow-sm transition-all duration-150 focus:outline-none focus:ring-2 focus:ring-primary" id="fullName" name="fullName" placeholder="Rahul Sharma" type="text"/>
</div>
</div>
<div>
<label class="block font-label-lg text-label-lg text-on-surface mb-1.5" for="email">
          Email address
        </label>
<div class="relative">
<input autocomplete="email" class="w-full h-11 px-3.5 rounded-lg bg-surface-container-lowest text-on-surface font-body-md text-body-md placeholder:text-outline shadow-sm transition-all duration-150 focus:outline-none focus:ring-2 focus:ring-primary" id="email" name="email" placeholder="rahul@collegemail.edu" required="" type="email"/>
</div>
</div>
<div>
<div class="flex items-center justify-between mb-1.5">
<label class="block font-label-lg text-label-lg text-on-surface" for="password">
            Password
          </label>
<button class="font-body-sm text-body-sm text-primary hover:text-primary-container transition-colors" onclick="triggerForgotPassword()" type="button">
            Forgot?
          </button>
</div>
<div class="relative flex items-center">
<input autocomplete="current-password" class="w-full h-11 pl-3.5 pr-11 rounded-lg bg-surface-container-lowest text-on-surface font-body-md text-body-md placeholder:text-outline shadow-sm transition-all duration-150 focus:outline-none focus:ring-2 focus:ring-primary" id="password" name="password" placeholder="••••••••••••" required="" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-0 top-0 bottom-0 px-3 flex items-center justify-center text-outline hover:text-on-surface transition-colors" id="toggle-password-btn" onclick="togglePasswordVisibility()" type="button">
<span class="material-symbols-outlined text-[20px]" id="password-visibility-icon">visibility</span>
</button>
</div>
</div>
<div class="pt-2">
<button class="w-full h-11 px-4 rounded-lg bg-primary hover:bg-primary-container text-on-primary font-label-lg text-label-lg transition-all duration-150 shadow-sm active:scale-[0.99] flex items-center justify-center gap-2" id="submit-cta-btn" type="submit">
<span>Log in</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</div>
</form>
<div class="mt-6 pt-5 text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
<span id="toggle-account-prompt">Don't have an account?</span>
<button class="font-label-lg text-label-lg text-primary hover:underline ml-1 focus:outline-none" id="toggle-account-btn" onclick="toggleAuthMode()" type="button">
          Create your account
        </button>
</p>
</div>
<div class="mt-6 p-3.5 rounded-lg bg-surface-container-low text-on-surface-variant flex items-start gap-2.5">
<span class="material-symbols-outlined text-[18px] text-primary flex-shrink-0 mt-0.5">key</span>
<div class="flex flex-col w-full text-left">
<div class="flex items-center justify-between">
<span class="font-label-sm text-label-sm font-semibold uppercase tracking-wider text-primary">Demo Credentials</span>
<button class="font-label-sm text-label-sm text-secondary hover:underline" onclick="fillDemoCredentials()" type="button">
            Auto-fill
          </button>
</div>
<p class="font-body-sm text-body-sm mt-0.5 select-all">
<span class="font-medium text-on-surface">Email:</span> rahul@demo.in  •  <span class="font-medium text-on-surface">Password:</span> password123
        </p>
</div>
</div>
</div>
</div>
<script>
  let currentMode = 'login';

  function switchAuthMode(mode) {
    currentMode = mode;
    const nameContainer = document.getElementById('field-name-container');
    const nameInput = document.getElementById('fullName');
    const tabLogin = document.getElementById('tab-login');
    const tabRegister = document.getElementById('tab-register');
    const submitBtn = document.getElementById('submit-cta-btn');
    const promptText = document.getElementById('toggle-account-prompt');
    const toggleBtn = document.getElementById('toggle-account-btn');
    const errorBox = document.getElementById('auth-error-box');

    errorBox.classList.add('hidden');

    if (mode === 'register') {
      nameContainer.classList.remove('hidden');
      nameInput.setAttribute('required', 'required');
      
      tabRegister.className = "flex-1 py-2 text-center font-label-lg text-label-lg rounded transition-colors duration-150 bg-surface-container-lowest text-primary shadow-sm";
      tabLogin.className = "flex-1 py-2 text-center font-label-lg text-label-lg rounded transition-colors duration-150 text-on-surface-variant hover:text-on-surface";
      
      submitBtn.querySelector('span').textContent = 'Sign Up';
      promptText.textContent = 'Already have an account?';
      toggleBtn.textContent = 'Sign in instead';
    } else {
      nameContainer.classList.add('hidden');
      nameInput.removeAttribute('required');
      
      tabLogin.className = "flex-1 py-2 text-center font-label-lg text-label-lg rounded transition-colors duration-150 bg-surface-container-lowest text-primary shadow-sm";
      tabRegister.className = "flex-1 py-2 text-center font-label-lg text-label-lg rounded transition-colors duration-150 text-on-surface-variant hover:text-on-surface";
      
      submitBtn.querySelector('span').textContent = 'Log in';
      promptText.textContent = "Don't have an account?";
      toggleBtn.textContent = 'Create your account';
    }
  }

  function toggleAuthMode() {
    switchAuthMode(currentMode === 'login' ? 'register' : 'login');
  }

  function togglePasswordVisibility() {
    const pwdInput = document.getElementById('password');
    const icon = document.getElementById('password-visibility-icon');
    if (pwdInput.type === 'password') {
      pwdInput.type = 'text';
      icon.textContent = 'visibility_off';
    } else {
      pwdInput.type = 'password';
      icon.textContent = 'visibility';
    }
  }

  function fillDemoCredentials() {
    switchAuthMode('login');
    document.getElementById('email').value = 'rahul@demo.in';
    document.getElementById('password').value = 'password123';
    document.getElementById('auth-error-box').classList.add('hidden');
  }

  function triggerForgotPassword() {
    const email = document.getElementById('email').value.trim();
    if (!email) {
      alert('Please enter your email address to receive password reset instructions.');
      document.getElementById('email').focus();
    } else {
      alert('Password reset instructions have been dispatched to: ' + email);
    }
  }

  function handleAuthSubmit(event) {
    event.preventDefault();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value.trim();
    const errorBox = document.getElementById('auth-error-box');

    if (currentMode === 'login') {
      if (email === 'rahul@demo.in' && password === 'password123') {
        errorBox.classList.add('hidden');
        alert('Welcome back, Rahul! Successfully authenticated.');
      } else {
        errorBox.classList.remove('hidden');
      }
    } else {
      const name = document.getElementById('fullName').value.trim();
      if (!name || !email || !password) {
        errorBox.classList.remove('hidden');
        errorBox.querySelector('span:nth-child(2)').textContent = 'Please fill out all registration fields.';
      } else {
        errorBox.classList.add('hidden');
        alert('Account created successfully for ' + name + '! Please check your inbox.');
        switchAuthMode('login');
      }
    }
  }
</script></main></body></html>
