services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: expenseease
      POSTGRES_PASSWORD: expenseease
      POSTGRES_DB: expenseease
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expenseease -d expenseease"]
      interval: 5s
      timeout: 5s
      retries: 12
  migrate:
    build: .
    command: npx prisma migrate deploy
    environment:
      DATABASE_URL: postgresql://expenseease:expenseease@db:5432/expenseease?schema=public
      JWT_SECRET: development-only-change-before-deploying
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
  app:
    build: .
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://expenseease:expenseease@db:5432/expenseease?schema=public
      JWT_SECRET: development-only-change-before-deploying
      CORS_ORIGIN: http://localhost:3001
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  postgres_data:
